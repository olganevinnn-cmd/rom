<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ромашка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dff3e7;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      width: min(94vw, 700px);
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .petal {
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .petal:hover {
      filter: brightness(0.94);
    }

    .petal:focus {
      outline: none;
    }

    .petal ellipse {
      stroke: white;
      stroke-width: 4;
      filter: drop-shadow(0 5px 4px rgba(0, 0, 0, 0.16));
    }

    .center {
      pointer-events: none;
    }

    #message {
      min-height: 64px;
      margin-top: 12px;
      padding: 14px 18px;
      border: 2px solid #8ab99c;
      border-radius: 14px;
      background: white;
      color: #244d36;
      font-size: clamp(16px, 3vw, 24px);
      font-weight: bold;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <svg viewBox="0 0 500 500" role="img" aria-label="Интерактивная ромашка">

      <!-- Верхний лепесток -->
      <g class="petal" data-text="Света"
         transform="translate(250 250) rotate(0) translate(0 -145)">
        <ellipse cx="0" cy="0" rx="58" ry="125" fill="#fff0a8"></ellipse>
      </g>

      <!-- Верхний правый лепесток -->
      <g class="petal" data-text="Марина"
         transform="translate(250 250) rotate(60) translate(0 -145)">
        <ellipse cx="0" cy="0" rx="58" ry="125" fill="#ffd6df"></ellipse>
      </g>

      <!-- Нижний правый лепесток -->
      <g class="petal" data-text="у Вали и так вход и премы, отстаньте"
         transform="translate(250 250) rotate(120) translate(0 -145)">
        <ellipse cx="0" cy="0" rx="58" ry="125" fill="#e2d5ff"></ellipse>
      </g>

      <!-- Нижний лепесток -->
      <g class="petal" data-text="ты ошибся и попал в Черешню"
         transform="translate(250 250) rotate(180) translate(0 -145)">
        <ellipse cx="0" cy="0" rx="58" ry="125" fill="#cdeaff"></ellipse>
      </g>

      <!-- Нижний левый лепесток -->
      <g class="petal" data-text="Маша"
         transform="translate(250 250) rotate(240) translate(0 -145)">
        <ellipse cx="0" cy="0" rx="58" ry="125" fill="#ffd9b8"></ellipse>
      </g>

      <!-- Верхний левый лепесток -->
      <g class="petal" data-text="Сходи скушай конфетку"
         transform="translate(250 250) rotate(300) translate(0 -145)">
        <ellipse cx="0" cy="0" rx="58" ry="125" fill="#d6f0c5"></ellipse>
      </g>

      <!-- Серединка ромашки -->
      <circle
        class="center"
        cx="250"
        cy="250"
        r="57"
        fill="#f5bd35"
        stroke="#dc9c18"
        stroke-width="8"
      ></circle>
    </svg>

    <div id="message">Нажмите на любой лепесток</div>
  </div>

  <script>
    const petals = document.querySelectorAll(".petal");
    const message = document.getElementById("message");

    petals.forEach(function (petal) {
      petal.addEventListener("click", function () {
        message.textContent = petal.dataset.text;
      });
    });
  </script>
</body>
</html>
